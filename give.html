<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Give | 166 Hours</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0b0f;
            color: #ffffff;
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 550px;
            margin: 0 auto;
            text-align: center;
        }
        .back {
            display: inline-block;
            margin-bottom: 30px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
        }
        .back:hover {
            color: #ffffff;
        }
        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 64px;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -1px;
            margin: 0 0 16px;
            color: #d4af37;
            text-transform: uppercase;
        }
        .subtitle {
            color: #cbd5e1;
            font-size: 16px;
            line-height: 1.6;
            margin: 0 0 36px;
        }
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 32px;
        }
        .gold-btn {
            display: block;
            width: 100%;
            padding: 17px 20px;
            background: linear-gradient(135deg, #d4af37, #aa7c11);
            color: #000000;
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            border-radius: 8px;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        .gold-btn:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }
        .eft-card {
            background: #121826;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 24px;
            text-align: left;
        }
        .eft-card h3 {
            color: #d4af37;
            margin: 0 0 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #1e293b;
            font-family: 'Montserrat', sans-serif;
            font-size: 16px;
            font-weight: 700;
        }
        .eft-details {
            color: #e2e8f0;
            font-size: 14px;
            line-height: 1.8;
        }
        .eft-details strong {
            color: #94a3b8;
        }
        @media (max-width: 600px) {
            h1 {
                font-size: 50px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <a href="index.html" class="back">← Back to 166 Hours</a>
    
    <h1>GIVE</h1>
    
    <p class="subtitle">
        Your support helps the mission reach more people.
    </p>

    <div class="button-group">
        <a href="https://paystack.shop/pay/fywmlolsfd" class="gold-btn">
            Give Once
        </a>
        
        <a href="https://paystack.shop/pay/166hours" class="gold-btn">
            Become a Monthly Partner
        </a>
    </div>

    <div class="eft-card">
        <h3>Direct Bank Transfer (EFT)</h3>
        <div class="eft-details">
            <strong>Account Name:</strong> [Account Name]<br>
            <strong>Bank:</strong> [Bank Name]<br>
            <strong>Account Type:</strong> [Account Type]<br>
            <strong>Account Number:</strong> [Account Number]<br>
            <strong>Branch Code:</strong> [Branch Code]<br>
            <strong>Reference:</strong> 166HOURS
        </div>
    </div>
</div>
</body>
</html>
