<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>166 HOURS | Choose Your Format</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0b0f;
            color: #ffffff;
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            text-align: center;
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 1px;
            margin: 0 0 14px;
            color: #d4af37;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 16px;
            line-height: 1.6;
            margin: 0 0 32px;
        }

        .button {
            display: block;
            width: 100%;
            height: 52px;
            margin: 0 0 14px;
            padding: 0;
            background: linear-gradient(135deg, #d4af37, #aa7c11);
            color: #000000;
            text-decoration: none;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 15px;
            font-weight: 700;
            line-height: 52px;
        }

        .button:hover {
            opacity: 0.92;
        }

        .note {
            color: #94a3b8;
            font-size: 13px;
            line-height: 1.5;
            margin-top: 24px;
        }

        .back {
            display: inline-block;
            margin-top: 28px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            color: #ffffff;
        }

        @media (max-width: 600px) {
            body {
                padding: 30px 20px;
            }

            h1 {
                font-size: 34px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>CHOOSE YOUR FORMAT</h1>

    <p class="subtitle">
        Your access is confirmed. Choose the edition you want.
    </p>

    <a href="#" class="button">
        DOWNLOAD PDF EDITION
    </a>

    <a href="#" class="button">
        DOWNLOAD EPUB EDITION
    </a>

    <a href="#" class="button">
        AMAZON KDP / PRINT EDITION
    </a>

    <p class="note">
        The digital editions are provided free. Print editions are available through Amazon.
    </p>

    <a href="index.html" class="back">← Back</a>

</div>

</body>
</html>
