        .formkit-form {

            font-size: 15px !important;
            font-weight: 400 !important;

            color: #555555 !important;
            opacity: 1 !important;
        }

            outline: none !important;

<body>

    <div class="container">

        <h1>GET 166 HOURS</h1>

        <p class="subtitle">
            Enter your details to access the field manual.
        </p>

        <script src="https://f.convertkit.com/ckjs/ck.5.js"></script>

        <form
            action="https://app.kit.com/forms/10004034/subscriptions"
            class="seva-form formkit-form"
            method="post"
            data-sv-form="10004034"
            data-uid="3704adf39b"
            data-format="inline"
            data-version="5"
            data-options='{
                "settings": {
                    "after_subscribe": {
                        "action": "redirect",
                        "success_message": "",
                        "redirect_url": "https://166hours.com/2.html"
                    }
                },
                "powered_by": {
                    "show": false
                },
                "recaptcha": {
                    "enabled": false
                }
            }'
        >

            <div data-style="clean">

                <ul
                    class="formkit-alert formkit-alert-error"
                    data-element="errors"
                    data-group="alert">
                </ul>

                <div
                    data-element="fields"
                    data-stacked="true"
                    class="seva-fields formkit-fields"
                >

                    <!-- FIRST NAME -->
                    <div class="formkit-field">
                        <input
                            class="formkit-input"
                            type="text"
                            name="first_name"
                            aria-label="First Name"
                            placeholder="First Name"
                            required
                        >
                    </div>

                    <!-- SURNAME -->
                    <div class="formkit-field">
                        <input
                            class="formkit-input"
                            type="text"
                            name="fields[surname]"
                            aria-label="Surname"
                            placeholder="Surname"
                            required
                        >
                    </div>

                    <!-- EMAIL LAST -->
                    <div class="formkit-field">
                        <input
                            class="formkit-input"
                            type="email"
                            name="email_address"
                            aria-label="Email Address"
                            placeholder="Email Address"
                            required
                        >
                    </div>

                    <!-- CONTINUE -->
                    <button
                        data-element="submit"
                        class="formkit-submit"
                        type="submit"
                    >
                        <span>CONTINUE</span>
                    </button>

                </div>
            </div>

        </form>

        <a href="index.html" class="back">← Back</a>

    </div>

</body>
