<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Get 166 Hours | 166 Hours</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0b0f;
            color: #e2e8f0;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            box-sizing: border-box;
        }

        .container {
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
        }

        .back-link {
            display: inline-block;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 35px;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: #d4af37;
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(2.8rem, 10vw, 4.5rem);
            font-weight: 900;
            line-height: 0.95;
            letter-spacing: -0.03em;
            margin: 0 0 15px 0;
            color: #d4af37;
            text-transform: uppercase;
        }

        .subtitle {
            color: #cbd5e1;
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        .form-box {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input[type="email"],
        input[type="text"] {
            width: 100%;
            padding: 16px 18px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #ffffff;
            color: #0f172a;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
        }

        input[type="email"]:focus,
        input[type="text"]:focus {
            border-color: #d4af37;
            box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.15);
        }

        input::placeholder {
            color: #64748b;
        }

        .submit-btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%);
            color: #0b0b0f;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            text-decoration: none;
            padding: 18px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
            transition: transform 0.2s ease, opacity 0.2s ease;
            box-sizing: border-box;
            margin-top: 5px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }

        .note {
            color: #64748b;
            font-size: 0.8rem;
            line-height: 1.5;
            margin-top: 25px;
        }

        @media (max-width: 480px) {
            body {
                padding: 30px 18px;
            }

            h1 {
                font-size: clamp(2.7rem, 14vw, 4rem);
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <a href="index.html" class="back-link">
            &larr; Back to 166 Hours
        </a>

        <h1>GET 166 HOURS</h1>

        <div class="subtitle">
            Enter your details to access the field manual.
        </div>

        <form
            class="form-box"
            action="https://tally.so/r/VLO7Ra"
            method="GET"
        >

            <input
                type="email"
                name="email"
                placeholder="Email Address"
                autocomplete="email"
                required
            >

            <input
                type="text"
                name="first_name"
                placeholder="First Name"
                autocomplete="given-name"
                required
            >

            <input
                type="text"
                name="surname"
                placeholder="Surname"
                autocomplete="family-name"
                required
            >

            <button type="submit" class="submit-btn">
                Continue
            </button>

        </form>

        <div class="note">
            Your details are used to provide access to 166 HOURS and communicate with you about the Mandate.
        </div>

    </div>

</body>
</html>
