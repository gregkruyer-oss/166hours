<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get the Manual | 166 Hours</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0B0E14;
      color: #ffffff;
      margin: 0;
      padding: 60px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .back-link {
      color: #94A3B8;
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 40px;
      transition: color 0.2s ease;
    }

    .back-link:hover {
      color: #D4AF37;
    }

    .container {
      max-width: 500px;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-family: 'Futura', 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: 1px;
      margin: 0 0 10px 0;
      text-transform: uppercase;
      color: #FFFFFF;
    }

    .subtitle {
      color: #CBD5E1;
      font-size: 1.1rem;
      margin-bottom: 40px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    input[type="email"],
    input[type="text"] {
      width: 100%;
      padding: 16px 20px;
      border-radius: 6px;
      border: 1px solid #334155;
      background-color: #FFFFFF;
      color: #0F172A;
      font-size: 1rem;
      box-sizing: border-box;
      outline: none;
    }

    input[type="email"]::placeholder,
    input[type="text"]::placeholder {
      color: #64748B;
    }

    button[type="submit"],
    .submit-btn {
      background: linear-gradient(180deg, #D4AF37 0%, #AA7C11 100%);
      color: #0B0E14;
      font-family: 'Inter', sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 16px 20px;
      border-radius: 6px;
      border: 1px solid #F3E5AB;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.25);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      width: 100%;
      margin-top: 10px;
    }

    button[type="submit"]:hover,
    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.45);
    }

    .footer-note {
      color: #64748B;
      font-size: 0.8rem;
      line-height: 1.5;
      margin-top: 30px;
    }

    .built-with {
      color: #334155;
      font-size: 0.85rem;
      font-weight: 700;
      margin-top: 25px;
    }
  </style>
</head>
<body>

  <a href="index.html" class="back-link">&larr; Back to 166 Hours</a>

  <div class="container">
    <h1>GET THE MANUAL</h1>
    <div class="subtitle">A Piece of Plastic.</div>

    <form action="#" method="POST">
      <input type="email" name="email" placeholder="Email Address" required>
      <input type="text" name="first_name" placeholder="First Name" required>
      <input type="text" name="surname" placeholder="Surname" required>
      
      <button type="submit" class="submit-btn">Download now</button>
    </form>

    <div class="built-with">Built with Kit</div>

    <div class="footer-note">
      Your details are used to provide access to the manual and communicate with you about the Mandate.
    </div>
  </div>

</body>
</html>
