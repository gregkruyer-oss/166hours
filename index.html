<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>166 Hours</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #111111; /* Dark/Black Background */
      color: #ffffff;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 600px;
      width: 100%;
    }
    h1 {
      font-size: 36px;
      margin-bottom: 5px;
      letter-spacing: 1px;
    }
    .subtitle {
      font-size: 14px;
      letter-spacing: 1.5px;
      opacity: 0.8;
      margin-bottom: 30px;
    }
    .button-card {
      display: block;
      background-color: #003366; /* Blue Buttons */
      color: #ffffff;
      text-decoration: none;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 15px;
      box-sizing: border-box;
      transition: background-color 0.2s ease;
    }
    .button-card:hover {
      background-color: #004080;
    }
    .button-title {
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 5px;
    }
    .button-subtext {
      font-size: 13px;
      color: #cccccc;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>166 HOURS</h1>
    <div class="subtitle">THE SUNDAY MORNING MANDATE</div>

    <a href="1.html" class="button-card">
      <div class="button-title">GET THE MANUAL</div>
    </a>

    <a href="2.html" class="button-card">
      <div class="button-title">DEPLOY THE MANDATE</div>
      <div class="button-subtext">Bring it to your church, city, marketplace or territory</div>
    </a>

    <a href="3.html" class="button-card">
      <div class="button-title">GIVE</div>
      <div class="button-subtext">Underwrite the Mandate's advance into the other 166</div>
    </a>
  </div>

</body>
</html>
